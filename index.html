<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>So... do you like me? 👀</title>

    <!-- Google Fonts (kept from original) -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating Background Elements -->
    <div class="floating-elements"></div>

    <!-- Main Content -->
    <div class="container">

        <h1 id="valentineTitle"></h1>

        <!-- Music Player (optional, subtle) -->
        <div id="musicControls" class="music-controls">
            <button id="musicToggle" class="music-btn">♪ Play something nice</button>

            <audio id="bgMusic" loop>
                <source id="musicSource" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <!-- Question 1 -->
        <div class="question-section" id="question1">
            <h2 id="question1Text"></h2>

            <!-- YES stays in place and is always easy to click -->
            <button class="cute-btn" id="yesBtn1"></button>

            <!-- NO moves (and occasionally changes its text) -->
            <button class="cute-btn" id="noBtn1"></button>

            <!-- Secret hint -->
            <div class="secret-answer">
                <button class="cute-btn special" id="secretAnswerBtn"></button>
            </div>
        </div>

        <!-- Question 2: Love Meter -->
        <div class="question-section hidden" id="question2">
            <h2 id="question2Text"></h2>

            <div class="love-meter">
                <input type="range" min="0" max="10000" value="100" class="slider" id="loveMeter">

                <p>
                    <span class="love-value-container">
                        <span id="startText"></span>
                        (<span id="loveValue">100</span>%)
                    </span>
                    <span id="extraLove" class="hidden"></span>
                </p>
            </div>

            <button class="cute-btn" id="nextBtn"></button>
        </div>

        <!-- Question 3: Final Question -->
        <div class="question-section hidden" id="question3">
            <h2 id="question3Text"></h2>

            <button class="cute-btn final-yes" id="yesBtn3"></button>
            <button class="cute-btn" id="noBtn3"></button>
        </div>

        <!-- Celebration -->
        <div class="celebration hidden" id="celebration">
            <h1 id="celebrationTitle"></h1>
            <p class="celebration-subtitle" id="celebrationMessage"></p>
            <p class="celebration-text hidden" id="celebrationEmojis"></p>

            <!-- Date & Time Picker: revealed once she says yes -->
            <div class="date-time-picker hidden" id="dateTimePicker">
                <h2 id="dateTimeHeading"></h2>
                <p class="date-time-intro" id="dateTimeIntro"></p>

                <form id="dateTimeForm" class="date-time-form" novalidate>
                    <div class="date-time-field">
                        <label for="meetingDate">Pick a day</label>
                        <input type="date" id="meetingDate" required>
                    </div>

                    <div class="date-time-field">
                        <label for="meetingTime">Pick a time</label>
                        <input type="time" id="meetingTime" required>
                    </div>

                    <div class="date-time-field">
                        <label for="visitorEmail">Your email</label>
                        <input type="email" id="visitorEmail" placeholder="Enter your email address" required>
                        <small class="field-error hidden" id="emailError"></small>
                    </div>

                    <!-- Honeypot: invisible to people, tempting to bots -->
                    <input type="text" id="hpField" name="company" class="hp-field" autocomplete="off" tabindex="-1" aria-hidden="true">

                    <button type="submit" class="cute-btn" id="sendDateBtn" disabled>
                        <span id="sendDateBtnText"></span>
                    </button>
                </form>

                <p class="date-time-sent hidden" id="dateTimeSentMessage"></p>
                <p class="date-time-sent hidden" id="dateTimeSentSubMessage"></p>

                <div class="date-time-error hidden" id="dateTimeErrorBlock">
                    <p class="date-time-error-text" id="dateTimeErrorText"></p>
                    <button type="button" class="cute-btn" id="tryAgainBtn"></button>
                </div>
            </div>
        </div>


    </div>

    <script src="script.js"></script>
</body>
</html>
